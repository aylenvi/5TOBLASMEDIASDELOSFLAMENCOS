<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Las medias de los flamencos — 5° Paula Albarracín</title><style>
:root{font-family:system-ui,'Trebuchet MS',sans-serif;color:#263d36;background:#dff5df}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#b5e6d0,#e9f9d6);min-height:100vh}header{background:#155e53;color:white;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}header strong{font-size:clamp(14px,2vw,19px)}.status{display:flex;gap:12px;align-items:center}.hearts{font-size:23px}.shell{max-width:1000px;margin:auto;padding:20px}.scene{background:linear-gradient(#9fe3ed 0 45%,#7acb8c 45% 73%,#3a9c85 73%);border:6px solid #fff;border-radius:28px;box-shadow:0 12px 35px #155e5340;min-height:250px;position:relative;overflow:hidden;padding:30px;text-align:center}.scene:before{content:'🌴       🌿       🌳        🌴       🌿';position:absolute;bottom:22%;left:0;width:100%;font-size:45px;opacity:.65;white-space:nowrap}.scene>*{position:relative}.animals{font-size:clamp(42px,8vw,85px);margin:20px 0;animation:bob 2.2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-12px)}}h1{font-size:clamp(27px,5vw,48px);color:#114d48;text-shadow:0 2px #fff;margin:12px 0}h2{margin:10px 0;color:#14574b}p{line-height:1.5}.panel{background:#fffef3;border-radius:24px;padding:22px;margin:20px 0;box-shadow:0 8px 22px #18543c21}.btn{border:0;border-radius:16px;padding:13px 20px;min-height:49px;background:#ffb343;color:#3d2914;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #b97524;touch-action:manipulation}.btn:hover{filter:brightness(1.05)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.secondary{background:#b8e4dd;box-shadow:0 4px 0 #6daaa0}.btn.danger{background:#ffd1c7;box-shadow:0 4px 0 #c47c6b}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:15px 0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#eff9f2;border:3px solid transparent;border-radius:18px;padding:16px 6px;cursor:pointer;font-size:17px;font-weight:700;min-height:125px}.card .emoji{font-size:52px;display:block}.card.selected{border-color:#f49a2e;background:#fff0cb}.card:disabled{opacity:.6}.feedback{min-height:28px;font-weight:800;color:#195e51;text-align:center}.progress{background:#d1e6d6;border-radius:99px;height:16px;overflow:hidden;flex:1;min-width:90px}.progress>div{height:100%;background:#ffb343;transition:width .4s}.topline{display:flex;align-items:center;gap:12px}.pill{background:#d9f0dc;padding:6px 12px;border-radius:99px;font-weight:800}.gridboard{display:grid;grid-template-columns:repeat(6,1fr);max-width:470px;margin:15px auto;gap:4px;background:#306a54;padding:7px;border-radius:15px}.cell{aspect-ratio:1;background:#d4efb7;border-radius:7px;display:grid;place-items:center;font-size:clamp(21px,5vw,39px)}.cell.goal{background:#ffe8a6}.cell.obstacle{background:#b6d0a3}.sequence{min-height:55px;border:2px dashed #80ad9c;border-radius:14px;padding:10px;overflow-wrap:anywhere;font-size:26px;text-align:center;background:#f2f8f0}.arrow{font-size:28px;min-width:64px}.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;margin:12px 0}.matchrow select{width:100%;min-height:50px;border-radius:12px;border:2px solid #8db9a4;font-size:16px;padding:6px;background:white}.dance{font-size:90px;display:inline-block;transition:transform .25s}.dance.move{transform:translateY(-24px) rotate(12deg)}.pattern{font-size:clamp(28px,6vw,44px);letter-spacing:7px;text-align:center}.mini{color:#49665b;font-size:14px}.hidden{display:none!important}@media(max-width:550px){.shell{padding:10px}.panel{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.scene{padding:20px 12px}.matchrow{grid-template-columns:1fr}.btn{padding:11px 13px}.cell{font-size:27px}}
</style></head><body><header><strong>🦩 LAS MEDIAS DE LOS FLAMENCOS · 5° PAULA ALBARRACÍN</strong><div class="status"><span id="hearts" class="hearts">❤️❤️❤️</span><button class="btn secondary" id="sound" aria-label="Activar o desactivar sonido">🔊</button><button class="btn danger" id="reset">REINICIAR</button></div></header><main class="shell"><div class="topline"><span id="missionTag" class="pill">AVENTURA</span><div class="progress"><div id="bar" style="width:0%"></div></div><span id="count">0/4</span></div><div id="app"></div></main><script>
(()=>{'use strict';const KEY='flamencos-paula-v1',app=document.querySelector('#app');let state={mission:0,lives:3,completed:0},sound=true,locked=false,seq=[],position=[0,0],selected=new Set(),stage=0,danceSeq=[];const icons={up:'↑',down:'↓',left:'←',right:'→'},moves={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]};const obstacles=new Set(['0,2','1,1','1,2','1,4','2,4','3,0','3,2','3,4','4,2','4,4','5,1']);const animals=[['🦩','FLAMENCOS',true],['🐍','VÍBORAS',true],['🐸','SAPOS',true],['🐊','YACARÉS',true],['🦁','LEONES',false],['🐘','ELEFANTES',false]];const patterns=[['↑','→','↑',null,'↑','→'],['←','↓','←','↓','←',null],['↑','↑','→','↑','↑','→',null]];function save(){localStorage.setItem(KEY,JSON.stringify(state))}try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Number.isInteger(s.mission)&&s.mission>=0&&s.mission<=5&&s.lives>=1&&s.lives<=3&&s.completed>=0&&s.completed<=4)state=s}catch{}function beep(ok=true){if(!sound)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?660:180;g.gain.value=.08;o.start();o.stop(ctx.currentTime+.15);o.onended=()=>ctx.close()}catch{}}function hud(){document.querySelector('#hearts').textContent='❤️'.repeat(state.lives)+'🖤'.repeat(3-state.lives);document.querySelector('#missionTag').textContent=state.mission===0?'INICIO':state.mission===5?'FINAL':`MISIÓN ${state.mission} DE 4`;document.querySelector('#bar').style.width=(state.completed/4*100)+'%';document.querySelector('#count').textContent=`${state.completed}/4`;document.querySelector('#sound').textContent=sound?'🔊':'🔇'}function feedback(t){const e=document.querySelector('#feedback');if(e)e.textContent=t}function fail(msg='¡INTENTÁ NUEVAMENTE!'){if(locked)return;state.lives--;beep(false);save();hud();if(state.lives<=0){app.innerHTML=`<section class="panel" style="text-align:center"><h1>💔 ¡NO TE RINDAS!</h1><p>PERDISTE TUS TRES VIDAS. ¡PODÉS VOLVER A INTENTARLO!</p><button class="btn" id="again">VOLVER A EMPEZAR</button></section>`;document.querySelector('#again').onclick=resetGame;locked=true}else feedback(`${msg} TE QUEDAN ${state.lives} VIDAS.`)}function success(msg){locked=true;beep();app.innerHTML=`<section class="scene"><div class="animals">🦩✨🎉</div><h1>¡MISIÓN SUPERADA!</h1><h2>${msg}</h2><button class="btn" id="next">CONTINUAR ➜</button></section>`;document.querySelector('#next').onclick=()=>{state.completed=Math.max(state.completed,state.mission);state.mission++;save();locked=false;render()};}function resetGame(){if(locked&&state.lives>0)return;state={mission:0,lives:3,completed:0};locked=false;save();render()}document.querySelector('#reset').onclick=()=>{if(confirm('¿QUERÉS BORRAR EL PROGRESO Y EMPEZAR DE NUEVO?')){locked=false;resetGame()}};document.querySelector('#sound').onclick=()=>{sound=!sound;hud();if(sound)beep()};function render(){hud();if(state.mission===0){app.innerHTML=`<section class="scene"><div class="animals">🌴🦩🐍🐸🦉🌴</div><h1>LAS MEDIAS DE LOS FLAMENCOS</h1><h2>DE 5° DEL PAULA ALBARRACÍN</h2><p><b>UNA AVENTURA DE LECTURA, LÓGICA Y PROGRAMACIÓN</b></p><p>LEN + ROBÓTICA Y ED. DIGITAL</p><button class="btn" id="start">¡COMENZAR LA AVENTURA!</button></section><section class="panel"><h2>🗺️ TU CAMINO</h2><p>🔒 MISIÓN 1: LA FIESTA · 🔒 MISIÓN 2: EL CAMINO · 🔒 MISIÓN 3: LAS MEDIAS · 🔒 MISIÓN 4: EL BAILE</p><p class="mini">TENÉS TRES VIDAS PARA COMPLETAR TODA LA AVENTURA.</p></section>`;document.querySelector('#start').onclick=()=>{state.mission=1;save();render()}}else if(state.mission===1)mission1();else if(state.mission===2)mission2();else if(state.mission===3)mission3();else if(state.mission===4)mission4();else{app.innerHTML=`<section class="scene"><div class="animals">🦩🎊🏆🦩</div><h1>¡FELICITACIONES!</h1><h2>SUPERASTE LAS CUATRO MISIONES</h2><p>¡DESCUBRISTE EL MISTERIO DE LAS MEDIAS DE LOS FLAMENCOS!</p><p>5° · PAULA ALBARRACÍN</p><button class="btn" id="again">VOLVER A LA AVENTURA</button></section>`;document.querySelector('#again').onclick=()=>{locked=false;resetGame()}}}
function mission1(){selected=new Set();stage=0;app.innerHTML=`<section class="scene"><div class="animals">🐍🎉🦩🐸🐊</div><h1>MISIÓN 1: ¡UNA FIESTA EN LA SELVA!</h1><p>SELECCIONÁ LOS CUATRO ANIMALES QUE APARECEN EN EL CUENTO.</p></section><section class="panel" id="work"><div class="cards" id="animalCards"></div><div class="buttons"><button class="btn" id="check">COMPROBAR</button></div><p class="feedback" id="feedback"></p></section>`;document.querySelector('#animalCards').innerHTML=animals.map((a,i)=>`<button class="card" data-animal="${i}"><span class="emoji">${a[0]}</span>${a[1]}</button>`).join('');document.querySelectorAll('[data-animal]').forEach(b=>b.onclick=()=>{const i=+b.dataset.animal;selected.has(i)?selected.delete(i):selected.add(i);b.classList.toggle('selected',selected.has(i))});document.querySelector('#check').onclick=()=>{if(selected.size!==4||[...selected].some(i=>!animals[i][2])){fail('REVISÁ QUÉ ANIMALES PARTICIPAN DE LA HISTORIA.');return}beep();document.querySelector('#work').innerHTML=`<h2>RELACIONÁ CADA PERSONAJE CON SU CARACTERÍSTICA</h2><p>SELECCIONÁ UNA RESPUESTA EN CADA FILA.</p><div id="matches"></div><div class="buttons"><button class="btn" id="checkMatch">COMPROBAR</button></div><p class="feedback" id="feedback"></p>`;const pairs=[['🦩 FLAMENCOS','BUSCAN MEDIAS PARA LUCIR EN LA FIESTA'],['🐍 VÍBORAS','ORGANIZAN LA FIESTA'],['🦉 LECHUZA','ENTREGA LAS MEDIAS MISTERIOSAS']];const opts=['ELEGÍ UNA OPCIÓN',...pairs.map(p=>p[1])];document.querySelector('#matches').innerHTML=pairs.map((p,i)=>`<div class="matchrow"><b>${p[0]}</b><select data-match="${i}">${opts.map((o,j)=>`<option value="${j-1}">${o}</option>`).join('')}</select></div>`).join('');document.querySelector('#checkMatch').onclick=()=>{if([...document.querySelectorAll('[data-match]')].every((s,i)=>+s.value===i))success('¡EXCELENTE! YA CONOCÉS A LOS INVITADOS DE LA FIESTA.');else fail('REVISÁ LAS RELACIONES ENTRE PERSONAJES.')};}}}
function mission2(){seq=[];position=[0,0];app.innerHTML=`<section class="scene"><div class="animals">🦩🌳🦉🏪</div><h1>MISIÓN 2: LOS FLAMENCOS BUSCAN SUS MEDIAS</h1><p>PROGRAMÁ EL CAMINO HASTA EL ALMACÉN. ¡EVITÁ LOS OBSTÁCULOS!</p></section><section class="panel"><div id="board" class="gridboard" aria-label="LABERINTO DE SEIS POR SEIS"></div><p class="mini" style="text-align:center">🦩 INICIO · 🏪 META · 🌳🪨💧 OBSTÁCULOS</p><h2>MI SECUENCIA</h2><div id="sequence" class="sequence">TOCÁ LAS FLECHAS PARA PROGRAMAR</div><div class="buttons" id="arrows"></div><div class="buttons"><button class="btn" id="run">▶ EJECUTAR</button><button class="btn secondary" id="erase">BORRAR ÚLTIMA</button><button class="btn danger" id="clear">REINICIAR SECUENCIA</button></div><p class="feedback" id="feedback"></p></section>`;document.querySelector('#arrows').innerHTML=Object.entries(icons).map(([k,v])=>`<button class="btn secondary arrow" data-dir="${k}" aria-label="${k}">${v}</button>`).join('');document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{if(locked)return;seq.push(b.dataset.dir);drawSeq()});document.querySelector('#erase').onclick=()=>{seq.pop();drawSeq()};document.querySelector('#clear').onclick=()=>{seq=[];position=[0,0];drawSeq();drawBoard()};document.querySelector('#run').onclick=runMaze;drawBoard();function drawSeq(){document.querySelector('#sequence').textContent=seq.length?seq.map(x=>icons[x]).join(' '):'TOCÁ LAS FLECHAS PARA PROGRAMAR'}function drawBoard(){let s='';for(let r=0;r<6;r++)for(let c=0;c<6;c++){const key=`${r},${c}`,wall=obstacles.has(key),goal=r===5&&c===5,here=position[0]===r&&position[1]===c;s+=`<div class="cell ${wall?'obstacle':''} ${goal?'goal':''}">${here?'🦩':goal?'🏪':wall?(['🌳','🪨','💧'][(r+c)%3]):''}</div>`}document.querySelector('#board').innerHTML=s}async function runMaze(){if(locked||!seq.length)return;locked=true;document.querySelectorAll('#arrows button,#run,#erase,#clear').forEach(b=>b.disabled=true);position=[0,0];drawBoard();let crashed=false;for(const dir of seq){await new Promise(r=>setTimeout(r,360));const d=moves[dir],nr=position[0]+d[0],nc=position[1]+d[1];if(nr<0||nr>5||nc<0||nc>5||obstacles.has(`${nr},${nc}`)){crashed=true;break}position=[nr,nc];drawBoard();if(nr===5&&nc===5)break}locked=false;if(position[0]===5&&position[1]===5){success('¡MUY BIEN! PROGRAMASTE EL CAMINO CORRECTAMENTE.');return}if(crashed)fail('¡CUIDADO! CHOCASTE CON UN OBSTÁCULO.');else feedback('TODAVÍA NO LLEGASTE AL ALMACÉN. PODÉS AGREGAR MÁS FLECHAS.');if(state.lives>0){document.querySelectorAll('#arrows button,#run,#erase,#clear').forEach(b=>b.disabled=false);position=[0,0];drawBoard()}}}
function mission3(){stage=0;app.innerHTML=`<section class="scene"><div class="animals">🦉🏪🧦</div><h1>MISIÓN 3: LAS MEDIAS MISTERIOSAS</h1><p>DESCUBRÍ CUÁLES SON LAS MEDIAS DEL CUENTO.</p></section><section class="panel" id="work"><h2>¿QUÉ MEDIAS LES ENTREGA LA LECHUZA?</h2><div class="cards"><button class="card" data-sock="0"><span class="emoji">🧦</span>MEDIAS DE LANA AZUL</button><button class="card" data-sock="1"><span class="emoji">🐍🧦</span>CUEROS DE VÍBORAS DE CORAL</button><button class="card" data-sock="2"><span class="emoji">🧦</span>MEDIAS DE ALGODÓN VERDE</button></div><p class="feedback" id="feedback"></p></section>`;document.querySelectorAll('[data-sock]').forEach(b=>b.onclick=()=>{if(locked)return;if(b.dataset.sock!=='1'){fail('ESAS NO SON LAS MEDIAS DEL CUENTO.');return}beep();document.querySelector('#work').innerHTML=`<h2>¿QUÉ DEBÍAN HACER LOS FLAMENCOS PARA EVITAR PROBLEMAS?</h2><div class="cards"><button class="card" data-answer="0">GUARDAR LAS MEDIAS EN UNA CAJA</button><button class="card" data-answer="1">BAILAR TODA LA NOCHE SIN PARAR</button><button class="card" data-answer="2">QUITARSE LAS MEDIAS ANTES DE BAILAR</button></div><p class="feedback" id="feedback"></p>`;document.querySelectorAll('[data-answer]').forEach(x=>x.onclick=()=>{if(x.dataset.answer==='1')success('¡FANTÁSTICO! DESCUBRISTE EL SECRETO DE LAS MEDIAS.');else fail('RECORDÁ LA ADVERTENCIA DE LA LECHUZA.')})})}
function mission4(){stage=0;danceSeq=[];app.innerHTML=`<section class="scene"><div class="animals">🎶🐍🦩🎶</div><h1>MISIÓN 4: ¡A BAILAR!</h1><p>COMPLETÁ LOS PATRONES Y PROGRAMÁ EL BAILE FINAL.</p></section><section class="panel" id="work"></section>`;danceStep();function danceStep(){if(stage<3){const pat=patterns[stage];document.querySelector('#work').innerHTML=`<h2>PATRÓN ${stage+1} DE 3</h2><p>¿QUÉ FLECHA CONTINÚA LA SECUENCIA?</p><div class="pattern">${pat.map(v=>v||'❓').join(' ')}</div><div class="buttons">${['↑','↓','←','→'].map(v=>`<button class="btn secondary arrow" data-pick="${v}">${v}</button>`).join('')}</div><div style="text-align:center"><span class="dance" id="dancer">🦩</span></div><p class="feedback" id="feedback"></p>`;const answers=['→','↓','↑'];document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(locked)return;if(b.dataset.pick!==answers[stage]){fail('OBSERVÁ CÓMO SE REPITE EL PATRÓN.');return}beep();stage++;const d=document.querySelector('#dancer');d.classList.add('move');setTimeout(danceStep,400)})}else{document.querySelector('#work').innerHTML=`<h2>🎵 ¡PROGRAMÁ TU PROPIO BAILE!</h2><p>ELEGÍ EXACTAMENTE OCHO FLECHAS Y PRESIONÁ EJECUTAR.</p><div class="pattern" id="danceSeq">0 / 8</div><div class="buttons">${Object.entries(icons).map(([k,v])=>`<button class="btn secondary arrow" data-dance="${k}">${v}</button>`).join('')}</div><div class="buttons"><button class="btn" id="danceRun">▶ EJECUTAR BAILE</button><button class="btn danger" id="danceClear">BORRAR</button></div><div style="text-align:center"><span class="dance" id="dancer">🦩</span></div><p class="feedback" id="feedback"></p>`;document.querySelectorAll('[data-dance]').forEach(b=>b.onclick=()=>{if(danceSeq.length<8&&!locked){danceSeq.push(b.dataset.dance);draw()}});document.querySelector('#danceClear').onclick=()=>{danceSeq=[];draw()};document.querySelector('#danceRun').onclick=async()=>{if(danceSeq.length!==8){feedback('NECESITÁS OCHO MOVIMIENTOS.');return}locked=true;document.querySelectorAll('#work button').forEach(b=>b.disabled=true);const dancer=document.querySelector('#dancer');for(const dir of danceSeq){dancer.style.transform=dir==='left'?'translateX(-25px) rotate(-15deg)':dir==='right'?'translateX(25px) rotate(15deg)':dir==='up'?'translateY(-28px)':'translateY(18px)';beep();await new Promise(r=>setTimeout(r,340));dancer.style.transform='';await new Promise(r=>setTimeout(r,100))}locked=false;success('¡INCREÍBLE! LOS FLAMENCOS BAILARON SIGUIENDO TU PROGRAMACIÓN.')};function draw(){document.querySelector('#danceSeq').textContent=`${danceSeq.map(d=>icons[d]).join(' ')} (${danceSeq.length}/8)`}}}}
render();})();
</script></body></html>
